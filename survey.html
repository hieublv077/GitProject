<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research Survey</title>
    <style>
        body {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background-color: #f0f3f5;
            padding: 30px 15px;
            color: #333333;
            margin: 0;
        }
        .survey-container {
            max-width: 680px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #0056b3;
        }
        .survey-header {
            margin-bottom: 25px;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 15px;
        }
        .survey-header h2 {
            margin: 0 0 8px 0;
            color: #222;
            font-size: 24px;
        }
        .survey-header p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .form-section {
            margin-bottom: 22px;
        }
        .form-section label.question-title {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .req {
            color: #e74c3c;
        }
        .choice-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .choice-list li {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .choice-list input[type="radio"],
        .choice-list input[type="checkbox"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        select, textarea, input[type="email"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }
        table.matrix {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }
        table.matrix th, table.matrix td {
            border: 1px solid #e0e0e0;
            padding: 8px;
            text-align: center;
        }
        table.matrix th {
            background-color: #f8f9fa;
        }
        table.matrix td:first-child {
            text-align: left;
            font-weight: 500;
        }
        .btn-submit {
            background-color: #0056b3;
            color: #ffffff;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        <div class="survey-header">
            <h2>Market Research Survey</h2>
            <p>Please take a few minutes to tell us more about you and your preferences.</p>
        </div>

        <form action="" method="POST">
            <!-- Câu 1: Độ tuổi -->
            <div class="form-section">
                <label class="question-title">What is your age range? <span class="req">*</span></label>
                <select name="age_range" required>
                    <option value="">-- Choose an option --</option>
                    <option value="18-24">18 - 24</option>
                    <option value="25-34">25 - 34</option>
                    <option value="35-44">35 - 44</option>
                    <option value="45-54">45 - 54</option>
                    <option value="55+">55+</option>
                </select>
            </div>

            <!-- Câu 2: Giới tính -->
            <div class="form-section">
                <label class="question-title">What is your gender? <span class="req">*</span></label>
                <ul class="choice-list">
                    <li><label><input type="radio" name="gender" value="male" required> Male</label></li>
                    <li><label><input type="radio" name="gender" value="female"> Female</label></li>
                    <li><label><input type="radio" name="gender" value="non-binary"> Non-binary</label></li>
                    <li><label><input type="radio" name="gender" value="prefer_not"> Prefer not to answer</label></li>
                </ul>
            </div>

            <!-- Câu 3: Mức độ sử dụng -->
            <div class="form-section">
                <label class="question-title">How often do you use our products/services? <span class="req">*</span></label>
                <ul class="choice-list">
                    <li><label><input type="radio" name="frequency" value="daily" required> Daily</label></li>
                    <li><label><input type="radio" name="frequency" value="weekly"> Once or twice a week</label></li>
                    <li><label><input type="radio" name="frequency" value="monthly"> Once or twice a month</label></li>
                    <li><label><input type="radio" name="frequency" value="rarely"> Rarely</label></li>
                </ul>
            </div>

            <!-- Câu 4: Đánh giá dịch vụ (Matrix Table) -->
            <div class="form-section">
                <label class="question-title">Please rate your satisfaction with the following aspects:</label>
                <table class="matrix">
                    <tr>
                        <th>Aspect</th>
                        <th>Very Unsatisfied</th>
                        <th>Neutral</th>
                        <th>Very Satisfied</th>
                    </tr>
                    <tr>
                        <td>Product Quality</td>
                        <td><input type="radio" name="quality" value="1"></td>
                        <td><input type="radio" name="quality" value="2"></td>
                        <td><input type="radio" name="quality" value="3"></td>
                    </tr>
                    <tr>
                        <td>Customer Support</td>
                        <td><input type="radio" name="support" value="1"></td>
                        <td><input type="radio" name="support" value="2"></td>
                        <td><input type="radio" name="support" value="3"></td>
                    </tr>
                    <tr>
                        <td>Value for Money</td>
                        <td><input type="radio" name="price" value="1"></td>
                        <td><input type="radio" name="price" value="2"></td>
                        <td><input type="radio" name="price" value="3"></td>
                    </tr>
                </table>
            </div>

            <!-- Câu 5: Ý kiến đóng góp -->
            <div class="form-section">
                <label class="question-title">What features would you like to see improved or added?</label>
                <textarea name="feedback" rows="4" placeholder="Enter your comments here..."></textarea>
            </div>

            <!-- Câu 6: Email -->
            <div class="form-section">
                <label class="question-title">Your Email (optional):</label>
                <input type="email" name="contact_email" placeholder="example@domain.com">
            </div>

            <div class="form-section">
                <button type="submit" class="btn-submit">Submit Survey</button>
            </div>
        </form>
    </div>

</body>
</html>
