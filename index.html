<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Box Model 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>So sánh Box-Sizing trong CSS Box Model</h1>

    <!-- Thẻ 1 -->
    <div class="card">
        <h3>Thẻ 1: content-box</h3>
        <p>Tổng width = 280 + 40 (padding) + 10 (border) = 330px.</p>
    </div>

    <!-- Thẻ 2 -->
    <div class="card">
        <h3>Thẻ 2: border-box</h3>
        <p>Tổng width giữ nguyên đúng 280px (đã bao gồm padding và border).</p>
    </div>

    <!-- Thẻ 3 -->
    <div class="card">
        <h3>Thẻ 3: border-box</h3>
        <p>Kích thước được kiểm soát cố định, dễ dàng căn chỉnh layout.</p>
    </div>

</body>
</html>
