<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Bộ Sưu Tập Hình Ảnh Responsive (RWD)</h2>
    <p class="subtitle">Thay đổi kích thước cửa sổ trình duyệt để quan sát số lượng ảnh hiển thị trên mỗi dòng</p>

    <div class="gallery-container clearfix">
        <!-- Ảnh 1 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Phong cảnh núi non">
                </a>
                <div class="desc">Thiên nhiên núi rừng hùng vĩ</div>
            </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Bờ biển nhiệt đới">
                </a>
                <div class="desc">Bãi biển hoàng hôn nhiệt đới</div>
            </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80">
                    <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80" alt="Rừng cây mùa thu">
                </a>
                <div class="desc">Rừng cây lá vàng mùa thu</div>
            </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Sương mù ban mai">
                </a>
                <div class="desc">Sương mù buổi sáng sớm</div>
            </div>
        </div>
    </div>

</body>
</html>
