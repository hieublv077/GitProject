<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành: CSS flex-flow Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ví dụ 1 -->
    <h2>1. flex-flow: row nowrap (Mặc định)</h2>
    <p class="desc">Các item xếp theo hàng ngang từ trái qua phải (1 &rarr; 2 &rarr; 3) và không xuống dòng.</p>
    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <!-- Ví dụ 2 -->
    <h2>2. flex-flow: row-reverse nowrap</h2>
    <p class="desc">Các item xếp theo hàng ngang nhưng đổi hướng từ phải qua trái (3 &larr; 2 &larr; 1) và không xuống dòng.</p>
    <div class="container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>
</html>
