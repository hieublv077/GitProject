<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - grid-row Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực hành: Thuộc tính grid-row trong CSS Grid</h2>
    <p class="desc">Lưới 3 cột x 3 hàng. <b>Ô 1</b> sử dụng <code>grid-row: 1 / 3;</code> (hoặc <code>grid-row: span 2;</code>) chiếm trọn 2 hàng liên tiếp.</p>

    <div class="grid-container">
        <div class="item item1">Ô 1 (grid-row: 1 / 3)</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>

</body>
</html>
