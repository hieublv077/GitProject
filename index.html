<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ví dụ 1 -->
    <h2>Ví dụ 1: Thiết lập khoảng cách hàng và cột bằng nhau</h2>
    <p class="desc">Cú pháp: <code>grid-gap: 20px;</code> (Hàng cách hàng 20px, cột cách cột 20px).</p>
    <div class="grid-container-1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <!-- Ví dụ 2 -->
    <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau</h2>
    <p class="desc">Cú pháp: <code>grid-gap: 30px 10px;</code> (Khoảng cách hàng: 30px, khoảng cách cột: 10px).</p>
    <div class="grid-container-2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
