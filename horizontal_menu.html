<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành: Tạo Menu Ngang (Horizontal Dropdown Menu)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 40px;
            background-color: #f4f6f8;
        }

        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }

        /* Phân vùng cho trình đơn: chiều cao, viền, màu nền */
        #menu {
            height: 40px;
            background-color: #333333;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        /* Danh sách menu chính */
        #menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* Các phần tử mục chọn hàng ngang của menu chính */
        #menu > ul > li {
            float: left;
            position: relative; /* Điểm mốc tọa độ cho dropdown con */
        }

        /* Định dạng liên kết trong trình đơn */
        #menu li a {
            display: block;
            width: 140px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            background-color: #333333;
            transition: background-color 0.2s ease;
        }

        /* Đổi màu nền (ví dụ màu đỏ) khi rê chuột qua liên kết */
        #menu li:hover > a {
            background-color: #e74c3c;
        }

        /* Định dạng menu con thả xuống (dropdown) */
        #menu ul ul {
            position: absolute;
            top: 40px; /* Ngay bên dưới thanh menu ngang */
            left: 0;
            width: 140px;
            visibility: hidden; /* Mặc định ẩn trình đơn con */
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        #menu ul ul li {
            position: relative;
        }

        #menu ul ul li a {
            background-color: #444444;
            border-top: 1px solid #555555;
            text-align: left;
            padding-left: 15px;
        }

        #menu ul ul li a:hover {
            background-color: #c0392b;
        }

        /* Hiển thị trình đơn con khi hover vào mục cha */
        #menu li:hover > ul {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <h2>Thực hành: Menu Ngang Đa Cấp (Dropdown Menu)</h2>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Khóa học &#9662;</a>
                <ul>
                    <li><a href="#">HTML & CSS</a></li>
                    <li><a href="#">JavaScript</a></li>
                    <li><a href="#">ReactJS</a></li>
                    <li><a href="#">NodeJS</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ &#9662;</a>
                <ul>
                    <li><a href="#">Thiết kế Web</a></li>
                    <li><a href="#">Lập trình App</a></li>
                    <li><a href="#">SEO Marketing</a></li>
                </ul>
            </li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
